# Formatting first, then `nix flake check`, which runs everything the
# flake defines, all of it offline. Everything the job builds is pushed to
# seenix.cachix.org, so the example closure the landing page links is
# always there and later jobs substitute rather than rebuild.
#
#   checks.tests — the node test suite: the Hilbert curve, layout, graph
#                  analysis, path-info import, the streaming NAR indexer
#                  against bytes nix wrote, and the real decoders
#   checks.site  — the deployable tree assembles: entry page and the
#                  hashed module directory in place
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: seenix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # A pull request from a fork has no token; read from the cache
          # and skip pushing rather than failing the job.
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Formatting
        run: nix fmt -- --ci

      - name: Tests
        run: nix flake check -L

      # The landing page links this closure from seenix.cachix.org, and
      # cachix-action pushes what the job built.
      - name: Example closure
        run: nix build .#example -L
