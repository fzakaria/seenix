# Formatting first, then `nix flake check`, which runs everything the
# flake defines, all of it offline:
#
#   checks.tests — the node test suite: the Hilbert curve, layout, graph
#                  analysis, path-info import, the streaming NAR indexer
#                  against bytes nix wrote, and the real decoders
#   checks.site  — the deployable tree assembles: entry page and the
#                  hashed module directory in place
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Formatting
        run: nix fmt -- --ci

      - name: Tests
        run: nix flake check -L
